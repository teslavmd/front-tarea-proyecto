<div class="page-container">
  <mat-card class="list-card">
    
    <mat-card-header class="card-header">
      <mat-card-title>Proyectos</mat-card-title>
      <button mat-flat-button color="primary" (click)="createNewProject()">
        <mat-icon>add</mat-icon>
        Nuevo Proyecto
      </button>
    </mat-card-header>

    <mat-card-content>
      @if(isLoading){
      <div class="loading-shade">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
      }

      @if(errorMessage && !isLoading){
      <div class="error-message">
        {{ errorMessage }}
      </div>
      }

      @if(!isLoading && !errorMessage){
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nombre del Proyecto </th>
          <td mat-cell *matCellDef="let project"> {{project.name}} </td>
        </ng-container>

        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef> Fecha de Inicio </th>
          <td mat-cell *matCellDef="let project"> {{project.startDate | date:'dd/MM/yyyy'}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let project">
            <mat-chip-set>
              <mat-chip [ngClass]="'chip-' + project.status.toLowerCase()">
                {{project.status}}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header"> Acciones </th>
          <td mat-cell *matCellDef="let project" class="actions-cell">
            <button mat-icon-button color="primary" matTooltip="Ver Detalle" (click)="viewDetail(project.id)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="accent" matTooltip="Cambiar Estado" (click)="changeStatus(project.id, project.status)">
              <mat-icon>edit_calendar</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="project-row"></tr>
        
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center" colspan="4">No hay proyectos para mostrar.</td>
        </tr>
      </table>
    }
    </mat-card-content>
  </mat-card>
</div>
