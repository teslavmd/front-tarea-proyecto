<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Crear Nuevo Proyecto</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="project-form">
        
        <mat-form-field appearance="outline">
          <mat-label>Nombre del Proyecto</mat-label>
          <input matInput formControlName="name" placeholder="Ej: Sistema de Gestión UNdeC">
          @if(projectForm.get('name')?.hasError('required')){
            <mat-error>El nombre es obligatorio</mat-error>
          }
        </mat-form-field>

        <div class="date-row">
          <mat-form-field appearance="outline">
            <mat-label>Fecha de Inicio</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Fecha de Finalización</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="actions">
          <button mat-button type="button" routerLink="/projects" [disabled]="isLoading">
            Cancelar
          </button>
          <button mat-flat-button color="primary" type="submit" [disabled]="projectForm.invalid || isLoading">
            {{ isLoading ? 'Guardando...' : 'Crear Proyecto' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
